---
# tasks file for gitops_cluster_build
- name: write install config to vault for vsphere
  community.hashi_vault.vault_write:
    url: "{{ hashicorp_vault['url'] }}"
    auth_method: jwt
    mount_point: "{{ hashicorp_vault['auth_mount'] }}"
    role_id: "{{ hashicorp_vault['auth_role'] }}"
    jwt: "{{ vault_jwt }}"
    path: "{{ hashicorp_vault['secret_base_path'] }}/data/{{ hashicorp_vault['cluster_secrets']['install-config'] }}"
    data:
      data:
        install-config.yaml: "{{ lookup('template', 'vsphere-install-config.yaml.j2') }}"
  no_log: true
  when: cluster_state == "present" and cluster_platform == "vsphere"

- name: create temporary directory for gitops repo
  ansible.builtin.tempfile:
    state: directory
    suffix: gitops
  register: gitops_temp_dir

- name: clone gitops repository to temporary directory
  ansible.builtin.git:
    repo: "{{ gitops_repo_url_authed }}"
    dest: "{{ gitops_temp_dir.path }}"
    version: "{{ gitops_repo_branch }}"
  no_log: true

- name: set git user name
  ansible.builtin.command:
    chdir: "{{ gitops_temp_dir.path }}"
    cmd: "/usr/bin/git config user.name '{{ gitops_author_name }}'"

- name: set git user email
  ansible.builtin.command:
    chdir: "{{ gitops_temp_dir.path }}"
    cmd: "/usr/bin/git config user.email '{{ gitops_author_email }}'"

- name: create new cluster directories
  ansible.builtin.file:
    state: directory
    path: "{{ gitops_temp_dir.path }}/{{ item }}"
  loop: >-
    {{ ['argocd/clusters/managed-clusters/' ~ cluster_name ~ '/helm-values']
       + ([] if gitops_autoshift_managed | bool
          else ['argocd/clusters/managed-clusters/' ~ cluster_name ~ '/live/base-configs']) }}
  when: cluster_state == "present" and cluster_platform != "metal"

- name: template cluster deployment
  ansible.builtin.template:
    src: "cluster-deploy-app.yaml.j2"
    dest: "{{ gitops_temp_dir.path }}/{{ cluster_builds_dir }}/{{ cluster_name }}.yaml"
  # The metal platform has no Application: AutoShift's cluster-install policies build the
  # cluster from its entry in the AutoShift values file.
  when: (cluster_state == "present" or gitops_task == "unprotect") and cluster_platform != "metal"

- name: template cluster deployment values
  ansible.builtin.template:
    src: "{{ cluster_platform }}-build-values.yaml.j2"
    dest: "{{ gitops_temp_dir.path }}/argocd/clusters/managed-clusters/{{ cluster_name }}/helm-values/build-values.yaml"
  when: cluster_state == "present" and cluster_platform != "metal"

- name: template base config
  ansible.builtin.template:
    src: "base-config-app.yaml.j2"
    dest: "{{ gitops_temp_dir.path }}/argocd/clusters/managed-clusters/{{ cluster_name }}/live/base-configs/base-config-app.yaml"
  when:
    - cluster_state == "present"
    - not (gitops_autoshift_managed | bool)

- name: template base config values
  ansible.builtin.template:
    src: "base-config-values.yaml.j2"
    dest: "{{ gitops_temp_dir.path }}/argocd/clusters/managed-clusters/{{ cluster_name }}/helm-values/base-config-values.yaml"
  when:
    - cluster_state == "present"
    - cluster_platform not in gitops_hcp_platforms
    - not (gitops_autoshift_managed | bool)

- name: template base config values
  ansible.builtin.template:
    src: "hcp-base-config-values.yaml.j2"
    dest: "{{ gitops_temp_dir.path }}/argocd/clusters/managed-clusters/{{ cluster_name }}/helm-values/base-config-values.yaml"
  when: 
    - cluster_state == "present"
    - cluster_platform in gitops_hcp_platforms

# AutoShift spokes: add, replace or remove this cluster's entry in the one
# per-cluster values file. Read-modify-write; keys are written sorted, so the
# file only changes when an entry does.
- name: update the cluster's AutoShift entry
  when: gitops_autoshift_managed | bool
  vars:
    autoshift_values_path: "{{ gitops_temp_dir.path }}/{{ autoshift_managed_clusters_file }}"
  block:
    - name: check for the AutoShift per-cluster values file
      ansible.builtin.stat:
        path: "{{ autoshift_values_path }}"
      register: autoshift_values_stat

    - name: read the AutoShift per-cluster values file
      ansible.builtin.slurp:
        src: "{{ autoshift_values_path }}"
      register: autoshift_values_raw
      when: autoshift_values_stat.stat.exists

    - name: load the current AutoShift cluster entries
      ansible.builtin.set_fact:
        autoshift_clusters: >-
          {{ (autoshift_values_doc['clusters'] | default({}, true))
             if autoshift_values_doc is mapping else {} }}
      vars:
        autoshift_values_doc: >-
          {{ (autoshift_values_raw.content | b64decode | from_yaml)
             if autoshift_values_stat.stat.exists else {} }}

    - name: set this cluster's AutoShift entry
      ansible.builtin.set_fact:
        autoshift_clusters: >-
          {{ autoshift_clusters | combine({cluster_name: lookup('ansible.builtin.template', 'autoshift-cluster-values.yaml.j2') | from_yaml}) }}
      when: cluster_state == "present"

    - name: drop this cluster's AutoShift entry
      ansible.builtin.set_fact:
        autoshift_clusters: >-
          {{ autoshift_clusters | dict2items | rejectattr('key', 'equalto', cluster_name) | items2dict }}
      when: cluster_state == "absent"

    - name: write the AutoShift per-cluster values file
      ansible.builtin.copy:
        dest: "{{ autoshift_values_path }}"
        mode: "0644"
        content: |
          # AutoShift per-cluster values for the spokes of {{ hub_name }}.
          # Written by the gitops_cluster_build Ansible role on cluster deploy and
          # undeploy; edits by hand are kept, but the role rewrites the whole file
          # (keys sorted, comments other than this header dropped).
          # Nothing secret: AutoShift renders this into ConfigMaps on the hub.
          {{ {'clusters': autoshift_clusters} | to_nice_yaml(indent=2, sort_keys=true, width=1000) }}

    - name: stage the AutoShift per-cluster values file
      ansible.builtin.command:
        cmd: "/usr/bin/git add {{ autoshift_managed_clusters_file }}"
        chdir: "{{ gitops_temp_dir.path }}"
      changed_when: false

- name: run git add for new files
  ansible.builtin.command:
    cmd: "/usr/bin/git add {{ item }}"
    chdir: "{{ gitops_temp_dir.path }}"
  loop:
    - "argocd/clusters/managed-clusters/{{ cluster_name }}"
    - "{{ cluster_builds_dir }}"
  when: cluster_state == "present"

- name: delete cluster gitops configs (retain cluster configs)
  ansible.builtin.command:
    cmd: "/usr/bin/git rm -r {{ item }}"
    chdir: "{{ gitops_temp_dir.path }}"
    removes: "{{ gitops_temp_dir.path }}/{{ item }}"
  loop:
    - "{{ cluster_builds_dir }}/{{ cluster_name }}.yaml"
  when: cluster_state == "absent" and gitops_retain_cluster_configs == true

- name: delete cluster gitops configs (destroy cluster configs)
  ansible.builtin.command:
    cmd: "/usr/bin/git rm -r {{ item }}"
    chdir: "{{ gitops_temp_dir.path }}"
    removes: "{{ gitops_temp_dir.path }}/{{ item }}"
  loop:
    - "argocd/clusters/managed-clusters/{{ cluster_name }}"
    - "{{ cluster_builds_dir }}/{{ cluster_name }}.yaml"
  when: cluster_state == "absent" and gitops_retain_cluster_configs == false

- name: commit changes
  ansible.builtin.command:
    cmd: '/usr/bin/git commit -a -m "Configure cluster {{ cluster_name }} via Ansible"'
    chdir: "{{ gitops_temp_dir.path }}"
  register: git_out
  failed_when: not "nothing to commit, working tree clean" in git_out.stdout_lines and git_out.rc != 0
  changed_when: not "nothing to commit, working tree clean" in git_out.stdout_lines

- name: push changes
  ansible.builtin.command:
    cmd: "/usr/bin/git push"
    chdir: "{{ gitops_temp_dir.path }}"
  when: git_out.changed and not gitops_skip_push

- name: delete temporary directory
  ansible.builtin.file:
    path: "{{ gitops_temp_dir.path }}"
    state: absent

- name: delete install config from vault for vsphere
  community.hashi_vault.vault_delete:
    url: "{{ hashicorp_vault['url'] }}"
    auth_method: jwt
    mount_point: "{{ hashicorp_vault['auth_mount'] }}"
    role_id: "{{ hashicorp_vault['auth_role'] }}"
    jwt: "{{ vault_jwt }}"
    path: "{{ hashicorp_vault['secret_base_path'] }}/data/{{ hashicorp_vault['cluster_secrets']['install-config'] }}"
  no_log: true
  when: cluster_state == "absent" and cluster_platform == "vsphere"
