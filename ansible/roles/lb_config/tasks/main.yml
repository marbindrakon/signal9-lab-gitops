---
# Registers/deregisters a cluster on the xna-haproxy anycast fleet WITHOUT
# editing /etc/haproxy/haproxy.cfg (owned by the lab-linux haproxy role).
#
# Contract (see lab-linux roles/haproxy/README.md):
#   - frontend routing: one line per map in /etc/haproxy/maps/ocp-*.map
#     (the shared fe-ocp-* frontends do a map_dom lookup after their static rules)
#   - backends (and dedicated-mode frontends): /etc/haproxy/conf.d/ocp-<cluster>.cfg
#     (the systemd unit loads conf.d via -f CFGDIR)
#   - validate both files together, then reload haproxy

- name: register vip facts on loadbalancer hosts
  ansible.builtin.set_fact:
    external_api_vip: "{{ hostvars['localhost']['external_api_vip'] | default(omit) }}"
    internal_api_vip: "{{ hostvars['localhost']['internal_api_vip'] | default(omit) }}"
    external_ingress_vip: "{{ hostvars['localhost']['external_ingress_vip'] | default(omit) }}"
    internal_ingress_vip: "{{ hostvars['localhost']['internal_ingress_vip'] | default(omit) }}"
    cluster_platform: "{{ hostvars['localhost']['cluster_platform'] | default(omit) }}"
    loadbalancer_type: "{{ hostvars['localhost']['loadbalancer_type'] | default(omit) }}"
    base_domain: "{{ hostvars['localhost']['base_domain'] | default(omit) }}"

- name: compute whether this cluster is exposed on the shared LB
  ansible.builtin.set_fact:
    lb_cluster_exposed: >-
      {{ loadbalancer_type == "external"
         or (loadbalancer_type == "internal" and expose_internal_loadbalancers | default(false)) }}

- name: handle shared frontend map entries
  block:
    - name: ensure api map entry
      ansible.builtin.lineinfile:
        path: /etc/haproxy/maps/ocp-api.map
        search_string: "api.{{ cluster_name }}.{{ base_domain }} be-{{ cluster_name }}-api"
        line: "api.{{ cluster_name }}.{{ base_domain }} be-{{ cluster_name }}-api"
        state: "{{ cluster_state }}"
      notify: "reload haproxy"
      when: loadbalancer_type == "external" or expose_internal_loadbalancers | default(false)

    - name: ensure api-int map entry when not using internal LB
      ansible.builtin.lineinfile:
        path: /etc/haproxy/maps/ocp-api.map
        search_string: "api-int.{{ cluster_name }}.{{ base_domain }} be-{{ cluster_name }}-api"
        line: "api-int.{{ cluster_name }}.{{ base_domain }} be-{{ cluster_name }}-api"
        state: "{{ cluster_state }}"
      notify: "reload haproxy"
      when: loadbalancer_type == "external"

    - name: ensure machineapi map entry when not using internal LB
      ansible.builtin.lineinfile:
        path: /etc/haproxy/maps/ocp-machineapi.map
        search_string: "{{ cluster_name }}.{{ base_domain }} be-{{ cluster_name }}-machineapi"
        line: "{{ cluster_name }}.{{ base_domain }} be-{{ cluster_name }}-machineapi"
        state: "{{ cluster_state }}"
      notify: "reload haproxy"
      when: loadbalancer_type == "external"

    - name: ensure ingress https map entry
      ansible.builtin.lineinfile:
        path: /etc/haproxy/maps/ocp-https.map
        search_string: "apps.{{ cluster_name }}.{{ base_domain }} be-{{ cluster_name }}-https"
        line: "apps.{{ cluster_name }}.{{ base_domain }} be-{{ cluster_name }}-https"
        state: "{{ cluster_state }}"
      notify: "reload haproxy"
      when: loadbalancer_type == "external" or (expose_internal_loadbalancers | default(false) and internal_ingress_vip is defined)

    - name: ensure ingress http map entry
      ansible.builtin.lineinfile:
        path: /etc/haproxy/maps/ocp-http.map
        search_string: "{{ cluster_name }}.{{ base_domain }} be-{{ cluster_name }}-http"
        line: "{{ cluster_name }}.{{ base_domain }} be-{{ cluster_name }}-http"
        state: "{{ cluster_state }}"
      notify: "reload haproxy"
      when: loadbalancer_type == "external" or (expose_internal_loadbalancers | default(false) and internal_ingress_vip is defined)

  when: loadbalancer_frontend_mode == "shared"

- name: handle dedicated frontend loopback VIPs
  block:
    - name: add loopback interface IP addresses
      ansible.builtin.command:
        cmd: "/sbin/ip addr add {{ item }}/32 dev lo"
      loop:
        - "{{ external_api_vip }}"
        - "{{ external_ingress_vip }}"
      when:
        - cluster_state == 'present'
        - item not in ansible_lo['ipv4'] | map('address')

    - name: remove loopback interface IP addresses
      ansible.builtin.command:
        cmd: "/sbin/ip addr del {{ item }}/32 dev lo"
      loop:
        - "{{ external_api_vip }}"
        - "{{ external_ingress_vip }}"
      when:
        - cluster_state == 'absent'
        - item in ansible_lo['ipv4'] | map('address')

  when: loadbalancer_frontend_mode == "dedicated"

- name: write cluster drop-in (backends + any dedicated frontends)
  ansible.builtin.template:
    src: ocp-cluster.cfg.j2
    dest: "/etc/haproxy/conf.d/ocp-{{ cluster_name }}.cfg"
    owner: root
    group: root
    mode: "0644"
  notify: "reload haproxy"
  when: cluster_state == 'present' and lb_cluster_exposed | bool

- name: remove cluster drop-in
  ansible.builtin.file:
    path: "/etc/haproxy/conf.d/ocp-{{ cluster_name }}.cfg"
    state: absent
  notify: "reload haproxy"
  when: cluster_state == 'absent' or not lb_cluster_exposed | bool

- name: validate combined haproxy configuration
  ansible.builtin.command:
    cmd: /usr/sbin/haproxy -c -q -f /etc/haproxy/haproxy.cfg -f /etc/haproxy/conf.d
  changed_when: false
