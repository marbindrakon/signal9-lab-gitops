---
controller_credentials:
  - name: "{{ env }} - vault"
    description: ""
    credential_type: "HashiCorp Vault Secret Lookup"
    organization: "Signal9 Lab - {{ env }}"
    inputs:
      api_version: v2
      cacert: ''
      default_auth_path: "{{ aap_vault_auth_path }}"
      kubernetes_role: "{{ aap_vault_auth_role }}"
      namespace: ''
      role_id: ''
      url: "{{ aap_vault_url }}"

  # Mints the per-job identity token (identity/oidc/token/aap-job) for
  # "{{ env }} - lab-hub job identity". Its Vault role can do nothing else.
  # api_version v1 = plain GET on the path.
  - name: "{{ env }} - vault identity"
    description: ""
    credential_type: "HashiCorp Vault Secret Lookup"
    organization: "Signal9 Lab - {{ env }}"
    inputs:
      api_version: v1
      cacert: ''
      default_auth_path: "{{ aap_vault_auth_path }}"
      kubernetes_role: "{{ aap_vault_identity_role }}"
      namespace: ''
      role_id: ''
      url: "{{ aap_vault_url }}"

...
