- name: get a kubernetes token for this job
  ansible.builtin.import_playbook: ../_job_auth.yml

- hosts: localhost
  gather_facts: false
  tasks:
    - name: update status in SNOW
      servicenow.itsm.api:
        resource: "{{ service_now['cluster_info_table'] }}"
        action: patch
        sys_id: "{{ snow_record_id }}"
        data:
          status: "Deprovisioning"

    # Adds Argo's resources finalizer and waits for it on the live
    # Application; undeploy_cluster.yml refuses Applications without it.
    - name: unprotect cluster since approval happened in SNOW
      ansible.builtin.include_tasks: ../_unprotect_cluster_app.yml
      when: cluster_protected == true

- name: run cluster undeploy
  ansible.builtin.import_playbook: ../undeploy_cluster.yml

- hosts: localhost
  gather_facts: false
  tasks:
    - name: wait up to one hour for cluster namespace to disappear
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: "{{ cluster_name }}"
      register: undeploy_ns_list
      until: undeploy_ns_list.resources is defined and undeploy_ns_list.resources | length == 0
      retries: 120
      delay: 30

    - name: delete cluster record in SNOW
      servicenow.itsm.api:
        resource: "{{ service_now['cluster_info_table'] }}"
        action: delete
        sys_id: "{{ snow_record_id }}"
