# Kubernetes access for AAP cluster jobs.
#
# AAP 2.6 (controller 4.7.17, RHSA-2026:71113) strips service-account tokens
# from container-group job pods, so these jobs no longer get in-cluster API
# access. The container group pod (namespace aap-jobs, see
# argocd/clusters/<hub_name>/live/aap-jobs/aap-jobs.yaml) provides instead:
#   vault_jwt            the pod's SPIFFE JWT-SVID for Vault, kept fresh by the
#                        spiffe-helper sidecar and used for every Vault login
#                        in these playbooks (inventories/group_vars/all.yml)
#   K8S_AUTH_KUBECONFIG  the kubeconfig path kubernetes.core reads
# This play uses vault_jwt to mint a short-lived token for the hub's
# (hub_name, group_vars) service account aap-jobs/aap-cluster-automation and
# writes it to that kubeconfig.
# Outside AAP (K8S_AUTH_KUBECONFIG unset) it does nothing.
- name: get a kubernetes token for this job
  hosts: localhost
  gather_facts: false
  tasks:
    - name: mint and install the job kubeconfig
      ansible.builtin.include_tasks: _job_auth_tasks.yml
