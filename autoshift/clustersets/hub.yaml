hubClusterSets:
  hub:
    labels:
      openshift-version: '5.0.1'
      self-managed: 'true'

      # OpenShift GitOps
      gitops: 'true'
      gitops-subscription-name: openshift-gitops-operator
      gitops-disable-default-argocd: 'true'
      gitops-channel: gitops-1.22
      gitops-source: redhat-operators
      gitops-source-namespace: openshift-marketplace

      # Advanced Cluster Management
      acm-subscription-name: advanced-cluster-management
      acm-channel: release-2.17
      acm-source: redhat-operators
      acm-source-namespace: openshift-marketplace
      acm-availability-config: Basic
      acm-enable-provisioning: 'true'
      # Provision bare-metal clusters from values (SiteConfig + assisted installer).
      cluster-install: 'true'

      # OpenShift Data Foundation, external mode against the lab Ceph cluster.
      # The 5.0 catalog only carries the stable-4.22 channel.
      odf: 'true'
      odf-external: 'true'
      odf-external-mcg: ignore
      odf-subscription-name: odf-operator
      odf-channel: stable-4.22
      odf-source: redhat-operators
      odf-source-namespace: openshift-marketplace
      odf-default-storageclass: ocs-storagecluster-ceph-rbd
      odf-csi-all-nodes: 'true'


      acm-search-storage: 'true'
      acm-search-storage-class: ocs-storagecluster-ceph-rbd
      acm-search-storage-size: 10Gi

      # Observability: Thanos on the lab Ceph object gateway (bucket per hub in hubs/<name>.yaml).
      acm-observability: 'true'
      acm-observability-storage: external-s3

      # Hive settings (Route 53 managed domain, lab CA) under config.hiveConfig.
      hive-config: 'true'

      # Zero Trust Workload Identity Manager (SPIRE); trust domain per hub.
      ztwim: 'true'
      ztwim-subscription-name: openshift-zero-trust-workload-identity-manager
      ztwim-channel: stable-v1
      ztwim-source: redhat-operators
      ztwim-source-namespace: openshift-marketplace

      # OpenShift Pipelines
      pipelines: 'true'
      pipelines-subscription-name: openshift-pipelines-operator-rh
      pipelines-channel: pipelines-1.24
      pipelines-source: redhat-operators
      pipelines-source-namespace: openshift-marketplace

      # Ansible Automation Platform 2.7: controller, Event-Driven Ansible and the MCP server.
      aap: 'true'
      aap-subscription-name: ansible-automation-platform-operator
      aap-channel: stable-2.7
      aap-install-plan-approval: Automatic
      aap-source: redhat-operators
      aap-source-namespace: openshift-marketplace
      aap-hub-disabled: 'true'
      aap-eda-disabled: 'false'
      aap-lightspeed-disabled: 'true'

      # etcd on Ceph RBD stalls briefly under load; the Slower profile rides through it.
      etcd-hardware-speed: Slower

      # External Secrets (Red Hat operator), with the Vault stores and secrets under config.
      external-secrets-operator: 'true'
      external-secrets-config: 'true'
      external-secrets-operator-subscription-name: openshift-external-secrets-operator
      external-secrets-operator-channel: stable-v1
      external-secrets-operator-source: redhat-operators
      external-secrets-operator-source-namespace: openshift-marketplace

      # cert-manager: Let's Encrypt (Route 53 DNS-01) for the API and ingress certificates.
      cert-manager: 'true'
      cert-manager-subscription-name: openshift-cert-manager-operator
      cert-manager-channel: stable-v1
      cert-manager-source: redhat-operators
      cert-manager-source-namespace: openshift-marketplace
      cert-manager-issuers: 'true'
      cert-manager-api-cert: 'true'
      cert-manager-ingress-cert: 'true'

      # Log in through Keycloak.
      oauth-identity-providers: 'true'

      # Enable autoshift console
      autoshift-console: 'true'

    config:
      autoshiftConsole:
        # Built per OpenShift minor — the console supplies react and react-router as shared
        # singletons, so one bundle cannot span releases. The policy appends ':ocp<minor>' using
        # the cluster's ACTUAL running version, so a cluster always pulls its own build and a
        # minor with no published build fails the pull rather than rendering nothing. Which minors
        # are published is whatever is tagged in the repository:
        # https://quay.io/repository/autoshift/autoshift-console-plugin?tab=tags
        repository: 'quay.io/autoshift/autoshift-console-plugin'
        replicas: 2
        # Optional. Overrides repository and the derived tag outright — set it to pin a digest in
        # production. Pinning one tag across a fleet spanning minors deploys the wrong bundle to
        # all but one of them.
        image: 'quay.io/autoshift/autoshift-console-plugin:ocp4.22'
      acm:
        observability:
          thanosStorage:
            endpoint: objectstore.atuin.signal9.gg:443
            insecure: false
            source:
              namespace: open-cluster-management-observability
              secretName: thanos-s3-credentials
        provisioning:
          # multicluster engine 2.17 ships assisted-installer images up to 4.22; OCP 5.0 boots
          # RHCOS 10.2 (the build `openshift-install 5.0.1 coreos print-stream-json` reports).
          # Setting the list replaces the default catalog, so only what the lab installs is here.
          # RHCOS 10 needs x86-64-v3 CPUs: the Supermicro X9 hosts can only run 4.22 (RHCOS 9).
          osImages:
            - openshiftVersion: '4.22'
              version: '4.22.21'
              cpuArchitecture: x86_64
              url: https://mirror.openshift.com/pub/openshift-v4/x86_64/dependencies/rhcos/4.22/4.22.21/rhcos-4.22.21-x86_64-live-iso.x86_64.iso
              rootFSUrl: https://mirror.openshift.com/pub/openshift-v4/x86_64/dependencies/rhcos/4.22/4.22.21/rhcos-4.22.21-x86_64-live-rootfs.x86_64.img
            - openshiftVersion: '5.0'
              version: '10.2.20261026-0'
              cpuArchitecture: x86_64
              url: https://rhcos.mirror.openshift.com/art/storage/prod/streams/rhel-10.2/builds/10.2.20261026-0/x86_64/rhcos-10.2.20261026-0-live-iso.x86_64.iso
              rootFSUrl: https://rhcos.mirror.openshift.com/art/storage/prod/streams/rhel-10.2/builds/10.2.20261026-0/x86_64/rhcos-10.2.20261026-0-live-rootfs.x86_64.img
          storageClass: ocs-storagecluster-ceph-rbd
          databaseSize: 50Gi
          filesystemStorageSize: 100Gi
          imageStorageSize: 100Gi
          # metal3 boots the IPMI-only hosts over PXE on the provisioning VLAN. The provisioning
          # IP and NIC MACs differ per hub: see hubs/<name>.yaml.
          # The policy enforces exactly this spec once metal3 is set, so it lists everything.
          metal3:
            provisioningNetwork: Managed
            watchAllNamespaces: true
            additionalNTPServers:
              - 172.18.0.79
              - 172.18.42.10
              - 172.18.42.11
            provisioningNetworkCIDR: 172.18.101.0/24
            provisioningDHCPRange: 172.18.101.50,172.18.101.199
            # false: with true, PXE-booted hosts are told to fetch the ramdisk root filesystem from the
            # API VIP on the machine network, which they cannot reach from VLAN 101 before their own
            # network config is applied (metal3's DHCP hands out no gateway). VLAN 101 is routed, so
            # virtual-media BMCs reach the provisioning IP directly.
            virtualMediaViaExternalNetwork: false
            disableVirtualMediaTLS: true

      externalSecretsOperator:
        # The operator's pods are deny-all by default; let the controller reach Vault
        # (the lab Vault's IPv4 and IPv6 front-end addresses).
        operatorConfig:
          controllerConfig:
            networkPolicies:
              - name: allow-vault
                componentName: ExternalSecretsCoreController
                egress:
                  - to:
                      - ipBlock:
                          cidr: 23.166.28.49/32
                      - ipBlock:
                          cidr: 2602:81f:4001::17/128
                    ports:
                      - port: 443
                        protocol: TCP
        clusterSecretStores:
          # Secrets shared by every lab cluster. The auth mount is per cluster: hubs/<name>.yaml.
          vault:
            provider:
              vault:
                server: https://vault.lab.signal9.gg
                path: lab/rht-shared
                version: v2
                auth:
                  kubernetes:
                    role: external-secrets-operator
                    serviceAccountRef:
                      name: external-secrets
                      namespace: external-secrets
          # Secrets only this cluster may read (Ceph keys, object storage keys).
          vault-cluster:
            provider:
              vault:
                server: https://vault.lab.signal9.gg
                path: lab/ansible-secrets
                version: v2
                auth:
                  kubernetes:
                    role: external-secrets-operator
                    serviceAccountRef:
                      name: external-secrets
                      namespace: external-secrets

      certManager:
        # The lab resolvers serve a private view of lab.signal9.gg, so the DNS-01 self-check has
        # to ask public resolvers or it never sees the challenge record.
        operatorConfig:
          controllerConfig:
            overrideArgs:
              - '--dns01-recursive-nameservers-only'
              - '--dns01-recursive-nameservers=8.8.8.8:53,1.1.1.1:53'
        clusterIssuers:
          letsencrypt:
            acme:
              server: https://acme-v02.api.letsencrypt.org/directory
              email: admin@signal9.gg
              privateKeySecretRef:
                name: letsencrypt-account-key
              solvers:
                - dns01:
                    route53:
                      region: us-east-1
                      accessKeyIDSecretRef:
                        name: route53-key
                        key: access-key
                      secretAccessKeySecretRef:
                        name: route53-key
                        key: secret-access-key
                  selector:
                    dnsZones:
                      - signal9.gg
                      - lab.signal9.gg
        apiCert:
          issuer:
            name: letsencrypt
            kind: ClusterIssuer
            group: cert-manager.io
        ingressCert:
          issuer:
            name: letsencrypt
            kind: ClusterIssuer
            group: cert-manager.io

      hiveConfig:
        managedDomains:
          - domains:
              - aws.signal9.gg
            aws:
              credentialsSecretRef:
                name: hive-route53-secret
        serviceProviderCredentialsConfig:
          aws:
            credentialsSecretRef:
              name: hive-aws-secret
        additionalCertificateAuthoritiesSecretRef:
          - name: signal9-ca-bundle

      aap:
        instance:
          mcp:
            disabled: false
            allow_write_operations: true
