apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: vlan10-bridge-dl380
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '3'
spec:
  nodeSelector:
    kubernetes.io/hostname: dl380-gen10.lab.signal9.gg
  desiredState:
    interfaces:
      - name: bond0.10
        type: vlan
        state: up
        mtu: 1500
        ipv4:
          enabled: false
        ipv6:
          enabled: false
        vlan:
          base-iface: bond0
          id: 10
      - name: br-vlan10
        description: VLAN 10 bridge for MetalLB L2 VIPs
        type: linux-bridge
        state: up
        ipv4:
          enabled: true
          dhcp: false
          address:
            - ip: 172.18.0.202
              prefix-length: 24
        ipv6:
          enabled: false
        bridge:
          options:
            stp:
              enabled: false
          port:
            - name: bond0.10
    # Policy-based routing: reply traffic sourced from the MetalLB VIPs
    # (and the bridge IP) returns via the VLAN 10 gateway instead of the
    # bond1.16 default route. The from-VIP rule also satisfies strict
    # rp_filter on br-vlan10 (fib_validate_source honors ip rules), so
    # inbound VIP traffic is no longer dropped as martian.
    routes:
      config:
        - destination: 172.18.0.0/24
          next-hop-interface: br-vlan10
          table-id: 100
        - destination: 0.0.0.0/0
          next-hop-address: 172.18.0.1
          next-hop-interface: br-vlan10
          table-id: 100
        # remove the previously-applied main-table default via br-vlan10
        - destination: 0.0.0.0/0
          next-hop-address: 172.18.0.1
          next-hop-interface: br-vlan10
          metric: 425
          state: absent
    # NOTE: OVN-KUBE-EXTERNALIP DNATs VIP->ClusterIP in PREROUTING, before
    # the RPF check and reply routing - both see the ClusterIP, not the VIP.
    # So the ClusterIPs of kube-apiserver (172.30.79.89) and
    # vlan10-ingress-passthrough (172.30.222.179) must be keyed here too.
    # These change if either service is recreated.
    route-rules:
      config:
        # EgressIP: forwarded pod-sourced traffic entering via the OVN
        # management port is exactly the multi-NIC EgressIP path (pod->node
        # traffic resolves in the local table first). Shadows OVN-K's
        # prio-6000 rules whose table has an unusable onlink default,
        # keeping the main table free of extra default routes.
        - ip-from: 10.128.0.0/14
          iif: ovn-k8s-mp0
          route-table: 100
          priority: 5900
        - ip-from: 172.30.79.89/32
          route-table: 100
          priority: 902
        - ip-from: 172.30.222.179/32
          route-table: 100
          priority: 903
        - ip-from: 172.18.0.204/32
          route-table: 100
          priority: 904
        - ip-from: 172.18.0.200/31
          route-table: 100
          priority: 900
        - ip-from: 172.18.0.202/32
          route-table: 100
          priority: 901
