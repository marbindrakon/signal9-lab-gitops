apiVersion: operator.open-cluster-management.io/v1
kind: MultiClusterHub
metadata:
  name: hub
  namespace: rhacm-hub
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  availabilityConfig: Basic
  # NOTE: must NOT be test-hcp-foundation - that namespace already exists on
  # this cluster (owned by lab-hub's governance-policy-framework addon), which
  # blocks MCE from creating the local ManagedCluster
  localClusterName: local-cluster
