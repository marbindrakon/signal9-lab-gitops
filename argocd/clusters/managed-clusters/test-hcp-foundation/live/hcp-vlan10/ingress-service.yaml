---
# Publishes the guest cluster's ingress directly on the VLAN 10 VIP,
# bypassing the parent cluster's router pods entirely. Mirrors the CPO's
# default-ingress-passthrough-service: same guest-router NodePort
# (targetPort), but with a pod selector for the cluster's virt-launcher
# pods so endpoints are maintained automatically.
# NOTE: targetPort must match the guest ingress NodePort the CPO uses in
# default-ingress-passthrough-service-* (31126); it can change if the
# guest's nodeport ingress service is ever recreated.
apiVersion: v1
kind: Service
metadata:
  name: vlan10-ingress-passthrough
  namespace: clusters-test-hcp-vlan10
  annotations:
    metallb.universe.tf/loadBalancerIPs: 172.18.0.201
    argocd.argoproj.io/sync-wave: '5'
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: https-443
    port: 443
    protocol: TCP
    targetPort: 31126
  selector:
    kubevirt.io: virt-launcher
    hypershift.openshift.io/infra-id: test-hcp-vlan10
  type: LoadBalancer
